<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calliser — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 16px;
        text-align: center;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      p { color: #64748b; font-size: 14px; }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">C</div>
      <h1 style="font-size: 20px; margin: 0">You're offline</h1>
      <p>Calliser needs an internet connection to load your calls.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
