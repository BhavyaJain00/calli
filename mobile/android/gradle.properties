org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# App version shown in the dashboard. Bump both for every release you publish;
# Android only installs an update when versionCode increases.
calliser.versionName=1.0.1
calliser.versionCode=2

# Optional: server address pre-filled on the sign-in screen, e.g.
# calliser.serverUrl=https://calls.example.com
calliser.serverUrl=
